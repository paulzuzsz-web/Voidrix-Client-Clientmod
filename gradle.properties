# ------------------------------------------------------------------
# Voidrix Client - build configuration
# ------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# --- Minecraft / Fabric toolchain -------------------------------
# Minecraft 26.2 (current stable). Note: 26.x ships *unobfuscated*, so there
# is no yarn/intermediary mapping dependency - we compile straight against
# Mojang's real class and method names.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.17

# Newest stable Fabric API build for 26.2
fabric_version=0.156.0+26.2

# --- Mod metadata ------------------------------------------------
mod_version=1.0.0
maven_group=gg.voidrix
archives_base_name=voidrix
